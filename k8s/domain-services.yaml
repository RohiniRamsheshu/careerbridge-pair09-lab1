apiVersion: apps/v1
kind: Deployment
metadata:
  name: p09-student
  namespace: p09-careerbridge
spec:
  replicas: 1
  selector:
    matchLabels: { app: p09-student }
  template:
    metadata: { labels: { app: p09-student } }
    spec:
      containers:
        - name: student
          image: p09-careerbridge/student:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.app.service_entrypoint", "--service", "student"]
          ports: [{ name: http, containerPort: 9091 }]
          envFrom:
            - configMapRef: { name: p09-careerbridge-config }
            - secretRef: { name: p09-careerbridge-secrets }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: p09-student, namespace: p09-careerbridge }
spec:
  selector: { app: p09-student }
  ports: [{ name: http, port: 9091, targetPort: http }]
---

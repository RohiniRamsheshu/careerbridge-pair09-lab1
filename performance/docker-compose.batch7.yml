services:
  mongo:
    # Batch 3 already owns host port 27017. Batch 7 only needs internal
    # Compose DNS connectivity and keeps its own named volume.
    ports: !override []
  mysql:
    ports: !override
      - "23306:3306"
  kafka:
    ports: !override
      - "29092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 30s
  backend:
    ports: !override
      - "19090:9090"
  frontend:
    build:
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:19090}
    ports: !override
      - "15173:80"
